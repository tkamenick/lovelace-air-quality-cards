# Sections-layout view for an Air Quality dashboard. Replace the example entity
# IDs with the sensors from your Home Assistant instance.

title: Air Quality
path: air-quality
type: sections
max_columns: 2
sections:
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Air quality
      - type: custom:air-quality-cards-overview
        rooms:
          - name: Upstairs
            radon: sensor.upstairs_radon
            co2: sensor.upstairs_co2
            pm25: sensor.upstairs_pm2_5
            voc: sensor.upstairs_voc
            temperature: sensor.upstairs_temperature
            humidity: sensor.upstairs_humidity
          - name: Basement
            radon: sensor.basement_radon
            co2: sensor.basement_co2
            pm25: sensor.basement_pm2_5
            voc: sensor.basement_voc
            temperature: sensor.basement_temperature
            humidity: sensor.basement_humidity

  - type: grid
    cards:
      - type: heading
        heading: Upstairs
      - type: custom:air-quality-cards-room
        room:
          name: Upstairs
          radon: sensor.upstairs_radon
          co2: sensor.upstairs_co2
          pm25: sensor.upstairs_pm2_5
          voc: sensor.upstairs_voc
          temperature: sensor.upstairs_temperature
          humidity: sensor.upstairs_humidity

  - type: grid
    cards:
      - type: heading
        heading: Basement
      - type: custom:air-quality-cards-room
        room:
          name: Basement
          radon: sensor.basement_radon
          co2: sensor.basement_co2
          pm25: sensor.basement_pm2_5
          voc: sensor.basement_voc
          temperature: sensor.basement_temperature
          humidity: sensor.basement_humidity

  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Radon
      - type: custom:air-quality-cards-radon
        rooms:
          - name: Basement
            radon: sensor.basement_radon
            # Optional: expose an existing long-term average sensor in the card.
            # radon_average: sensor.basement_radon_30d_average
          - name: Upstairs
            radon: sensor.upstairs_radon
            # radon_average: sensor.upstairs_radon_30d_average

      # Keep Home Assistant's recorder-backed graph for the long view. The
      # custom card gives the current reading context; the graph answers trend.
      - type: statistics-graph
        title: Radon — 30-day daily averages
        chart_type: line
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - sensor.basement_radon
          - sensor.upstairs_radon
